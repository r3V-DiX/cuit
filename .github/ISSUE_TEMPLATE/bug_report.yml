name: Bug Report
description: Report something broken in cykruit.com
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - cykruit-app (backend)
        - cykruit-ui (frontend)
        - admin-app (backend)
        - admin-ui (frontend)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, screenshots, or logs if you have them.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Staging, production, local? Browser/OS if relevant?
      placeholder: e.g. production, Chrome on Windows
    validations:
      required: false
