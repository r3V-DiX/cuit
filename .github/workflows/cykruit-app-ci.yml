name: Build and Push Cykruit App (Production)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cykruit-app/**'
      - '.github/workflows/cykruit-app-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cykruit-app/**'
      - '.github/workflows/cykruit-app-ci.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AI Service
            tag_prefix: ai-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/ai-service/Dockerfile
          - name: Auth Service
            tag_prefix: auth-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/auth-service/Dockerfile
          - name: User Settings Service
            tag_prefix: user-settings-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/user-settings-service/Dockerfile
          - name: Seeker Profile Service
            tag_prefix: seeker-profile-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/seeker-profile-service/Dockerfile
          - name: Employer Service
            tag_prefix: employer-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/employer-service/Dockerfile
          - name: Seeker Service
            tag_prefix: seeker-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/seeker-service/Dockerfile
          - name: Public Service
            tag_prefix: public-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/public-service/Dockerfile
          - name: Notification Service
            tag_prefix: notification-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/notification-service/Dockerfile
          - name: Subscription Service
            tag_prefix: subscription-service
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/subscription-service/Dockerfile
          - name: Gateway
            tag_prefix: gateway
            context: ./cykruit-app
            dockerfile: ./cykruit-app/apps/gateway/Dockerfile

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-app
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}-latest
            type=raw,value=${{ matrix.tag_prefix }}-prod-latest
            type=sha,prefix=${{ matrix.tag_prefix }}-prod-
            type=raw,value=${{ matrix.tag_prefix }}-prod-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 ${{ matrix.name }} Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.login-ecr.outputs.registry }}/cykruit-app\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ matrix.tag_prefix }}-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ matrix.tag_prefix }}-prod-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ matrix.tag_prefix }}-prod-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ matrix.tag_prefix }}-prod-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
