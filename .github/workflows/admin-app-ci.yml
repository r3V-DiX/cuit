name: Build, Push & Deploy Admin App (Staging + Production)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-app/**"
      - "cykruit-app/libs/**"
      - "cykruit-app/prisma/**"
      - ".github/workflows/admin-app-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin-app/**"
      - "cykruit-app/libs/**"
      - "cykruit-app/prisma/**"
      - ".github/workflows/admin-app-ci.yml"
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-admin-app
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — staging
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Admin App Build Successful (staging)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`staging-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  build-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-admin-app
          tags: |
            type=raw,value=latest
            type=raw,value=prod-latest
            type=sha,prefix=prod-
            type=raw,value=prod-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Admin App Build Successful (prod)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:** \`prod-${{ github.sha }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY

  # ── Deploy: staging — no approval gate (see Environment protection rules in repo Settings) ──
  deploy-staging:
    needs: build-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🔐 Configure AWS Credentials (staging deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy admin-app to staging EC2
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          aws ssm send-command \
            --targets "Key=tag:Name,Values=cykruit-v2-app-server-staging" \
            --document-name "AWS-RunShellScript" \
            --comment "cykruit-v2 staging: deploy admin-app ($SHORT_SHA)" \
            --parameters "commands=[\"/opt/cykruit-v2/deploy.sh staging admin-app $SHORT_SHA\"]" \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }}

  # ── Deploy: production — gated. Configure a required-reviewer protection rule on the
  #    'production' Environment in repo Settings → Environments; this job pauses until approved ──
  deploy-prod:
    needs: build-prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🔐 Configure AWS Credentials (prod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy admin-app to prod EC2
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          aws ssm send-command \
            --targets "Key=tag:Name,Values=cykruit-v2-app-server-prod" \
            --document-name "AWS-RunShellScript" \
            --comment "cykruit-v2 prod: deploy admin-app ($SHORT_SHA)" \
            --parameters "commands=[\"/opt/cykruit-v2/deploy.sh prod admin-app $SHORT_SHA\"]" \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }}
