name: Build and Push Admin App (Production)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-app/**"
      - "cykruit-app/libs/**"
      - "cykruit-app/prisma/**"
  pull_request:
    branches:
      - main
    paths:
      - "admin-app/**"
      - "cykruit-app/libs/**"
      - "cykruit-app/prisma/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-admin-app
          tags: |
            type=raw,value=latest
            type=raw,value=prod-latest
            type=sha,prefix=prod-
            type=raw,value=prod-${{ github.run_number }}

      - name: 📦 Build Docker image (for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-app/Dockerfile
          push: false
          tags: test-image:latest
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          no-cache: true

      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Production Admin App Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`prod-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`prod-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`prod-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
