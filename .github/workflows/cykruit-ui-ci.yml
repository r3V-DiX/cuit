name: Build, Push & Deploy Cykruit UI (Staging + Production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cykruit-ui/**'
      - '.github/workflows/cykruit-ui-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cykruit-ui/**'
      - '.github/workflows/cykruit-ui-ci.yml'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-ui
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — staging
        uses: docker/build-push-action@v5
        with:
          context: ./cykruit-ui
          file: ./cykruit-ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.STAGING_NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}
            NODE_ENV=production
            AUTH_SERVICE_URL=http://auth-service:4001
            SETTINGS_SERVICE_URL=http://user-settings-service:4002
            PROFILE_SERVICE_URL=http://seeker-profile-service:4003
            EMPLOYER_SERVICE_URL=http://employer-service:4004
            SEEKER_SERVICE_URL=http://seeker-service:4005
            PUBLIC_SERVICE_URL=http://public-service:4006
            NOTIF_SERVICE_URL=http://notification-service:4007
            SUBS_SERVICE_URL=http://subscription-service:4008
            AI_SERVICE_URL=http://ai-service:3005
          cache-from: type=gha,scope=cykruit-ui-staging
          cache-to: type=gha,mode=max,scope=cykruit-ui-staging

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Cykruit UI Build Successful (staging)" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`staging-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Only build prod on actual pushes to main, not on PRs
  build-prod:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-ui
          tags: |
            type=raw,value=latest
            type=raw,value=prod-latest
            type=sha,prefix=prod-
            type=raw,value=prod-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — prod
        uses: docker/build-push-action@v5
        with:
          context: ./cykruit-ui
          file: ./cykruit-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.PROD_NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
            NODE_ENV=production
            AUTH_SERVICE_URL=http://auth-service:4001
            SETTINGS_SERVICE_URL=http://user-settings-service:4002
            PROFILE_SERVICE_URL=http://seeker-profile-service:4003
            EMPLOYER_SERVICE_URL=http://employer-service:4004
            SEEKER_SERVICE_URL=http://seeker-service:4005
            PUBLIC_SERVICE_URL=http://public-service:4006
            NOTIF_SERVICE_URL=http://notification-service:4007
            SUBS_SERVICE_URL=http://subscription-service:4008
            AI_SERVICE_URL=http://ai-service:3005
          cache-from: type=gha,scope=cykruit-ui-prod
          cache-to: type=gha,mode=max,scope=cykruit-ui-prod

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Cykruit UI Build Successful (prod)" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:** \`prod-${{ github.sha }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    needs: build-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials (staging deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy cykruit-ui to staging EC2
        run: bash ./scripts/deploy.sh staging dispatch cykruit-ui "${GITHUB_SHA::7}"

  deploy-prod:
    needs: build-prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials (prod deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy cykruit-ui to prod EC2
        run: bash ./scripts/deploy.sh prod dispatch cykruit-ui "${GITHUB_SHA::7}"
