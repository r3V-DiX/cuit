name: Build, Push & Deploy Admin UI (Staging + Production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui-ci.yml"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-admin-ui
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — staging
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          file: ./admin-ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_ADMIN_NEXT_PUBLIC_API_URL }}
            ADMIN_SERVICE_URL=http://admin-app:4010
          cache-from: type=gha,scope=admin-ui-staging
          cache-to: type=gha,mode=max,scope=admin-ui-staging

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Admin UI Build Successful (staging)" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`staging-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Only build prod on actual pushes to main, not on PRs
  build-prod:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🔑 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📝 Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/cykruit-admin-ui
          tags: |
            type=raw,value=latest
            type=raw,value=prod-latest
            type=sha,prefix=prod-
            type=raw,value=prod-${{ github.run_number }}

      - name: 🚀 Build and Push Docker image — prod
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          file: ./admin-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_ADMIN_NEXT_PUBLIC_API_URL }}
            ADMIN_SERVICE_URL=http://admin-app:4010
          cache-from: type=gha,scope=admin-ui-prod
          cache-to: type=gha,mode=max,scope=admin-ui-prod

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Admin UI Build Successful (prod)" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:** \`prod-${{ github.sha }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    needs: build-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 🔐 Configure AWS Credentials (staging deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy admin-ui to staging EC2
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          aws ssm send-command \
            --targets "Key=tag:Name,Values=cykruit-v2-app-server-staging" \
            --document-name "AWS-RunShellScript" \
            --comment "cykruit-v2 staging: deploy admin-ui ($SHORT_SHA)" \
            --parameters "commands=[\"/opt/cykruit-v2/deploy.sh staging admin-ui $SHORT_SHA\"]" \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }}

  deploy-prod:
    needs: build-prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 🔐 Configure AWS Credentials (prod deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Deploy admin-ui to prod EC2
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          aws ssm send-command \
            --targets "Key=tag:Name,Values=cykruit-v2-app-server-prod" \
            --document-name "AWS-RunShellScript" \
            --comment "cykruit-v2 prod: deploy admin-ui ($SHORT_SHA)" \
            --parameters "commands=[\"/opt/cykruit-v2/deploy.sh prod admin-ui $SHORT_SHA\"]" \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }}
