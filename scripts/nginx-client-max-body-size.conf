# /etc/nginx/conf.d/client-max-body-size.conf
# Global upload size cap — included automatically by nginx.conf's conf.d/*.conf glob.
# Without this, nginx defaults to 1M and silently 413s any upload above that
# (ad creatives, KYC documents, company logos, etc.) before it ever reaches
# the backend's own Multer/file-size validation.
client_max_body_size 10M;
