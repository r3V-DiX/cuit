      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  notification-service:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-app:notification-service-${ENV}-${CYKRUIT_APP_TAG:-latest}
    restart: unless-stopped
    ports: ["4007:4007"]
    env_file: /opt/cykruit-v2/.env.${ENV}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4007/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  subscription-service:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-app:subscription-service-${ENV}-${CYKRUIT_APP_TAG:-latest}
    restart: unless-stopped
    ports: ["4008:4008"]
    env_file: /opt/cykruit-v2/.env.${ENV}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  gateway:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-app:gateway-${ENV}-${CYKRUIT_APP_TAG:-latest}
    restart: unless-stopped
    ports: ["5000:5000"]
    env_file: /opt/cykruit-v2/.env.${ENV}
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      SETTINGS_SERVICE_URL: http://user-settings-service:4002
      SEEKER_PROFILE_SERVICE_URL: http://seeker-profile-service:4003
      EMPLOYER_SERVICE_URL: http://employer-service:4004
      SEEKER_SERVICE_URL: http://seeker-service:4005
      PUBLIC_SERVICE_URL: http://public-service:4006
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:4008
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/gateway/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on: [auth-service, user-settings-service, seeker-profile-service, employer-service, seeker-service, public-service, notification-service, subscription-service]
  admin-app:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-admin-app:${ENV}-${ADMIN_APP_TAG:-latest}
    restart: unless-stopped
    ports: ["4010:4010"]
    env_file: /opt/cykruit-v2/.env.${ENV}.admin
    environment:
      # TASK B14 — System Health panel needs all 9, not just SUBSCRIPTION.
      AI_SERVICE_URL: http://ai-service:3005
      AUTH_SERVICE_URL: http://auth-service:4001
      SETTINGS_SERVICE_URL: http://user-settings-service:4002
      SEEKER_PROFILE_SERVICE_URL: http://seeker-profile-service:4003
      EMPLOYER_SERVICE_URL: http://employer-service:4004
      SEEKER_SERVICE_URL: http://seeker-service:4005
      PUBLIC_SERVICE_URL: http://public-service:4006
      NOTIFICATION_SERVICE_URL: http://notification-service:4007
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:4008
      GATEWAY_URL: http://gateway:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  cykruit-ui:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-ui:${ENV}-${CYKRUIT_UI_TAG:-latest}
    restart: unless-stopped
    ports: ["3000:3000"]
  admin-ui:
    image: 443370715886.dkr.ecr.ap-south-1.amazonaws.com/cykruit-admin-ui:${ENV}-${ADMIN_UI_TAG:-latest}
    restart: unless-stopped
    ports: ["3100:3100"]

volumes:
  redis_data:
    driver: local
